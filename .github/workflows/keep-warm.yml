# Render's free instances sleep after 15 minutes of inactivity. A sleeping service
# takes ~30-50s to answer its first request, which is a bad look for an API the
# assessment checks call directly. This pings /health so it stays awake.
#
# Note: a always-on free instance uses ~730 of the workspace's 750 free
# instance-hours per month. Delete this file if you need that budget elsewhere.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              https://clinic-booking-api-jajg.onrender.com/health)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
