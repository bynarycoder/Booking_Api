services:
  - type: web
    name: clinic-booking-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: API_KEY
        value: clinic-demo-key-2026
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString

databases:
  - name: clinic-db
    plan: free
    databaseName: clinic
    user: clinic
